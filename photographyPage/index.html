<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <div class="mainBox">
        <input type="checkbox" id="check">
        <div class="btnOne">
            <label for="check" class="btn">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>

        <div class="sidebarMenu">

            <div class="logo">
                <a href="#">Photography Studio</a>
            </div>

            <div class="btnTwo">
                <label for="check" class="btn">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </div>

            <div class="menu">
                <ul>
                    <li><i class="fa-regular fa-image"></i> Gallery</li>
                    <li><i class="fa-solid fa-square-up-right"></i> Shortcuts</li>
                    <li><i class="fa-regular fa-images"></i> Exhibits</li>
                    <li><i class="fa-solid fa-calendar-days"></i> Events</li>
                    <li><i class="fa-solid fa-shop"></i> Store</li>
                    <li><i class="fa-solid fa-phone"></i> Contact</li>
                    <li><i class="fa-solid fa-comment"></i> Feedback</li>
                </ul>
            </div>
            <div class="socialMedia">
                <ul>
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"> <i class="fab fa-youtube"></i></a>
                </ul>
            </div>
        </div>

    </div>
</body>

</html>
